[build]
  base = "mirror"
  command = "node build.mjs"
  publish = "dist"
  ignore = "git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- ':(top)docs' ':(top)mirror' ':(top)netlify.toml'"
[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
[[edge_functions]]
  function = "api"
  path = "/api"
[[edge_functions]]
  function = "api"
  path = "/api/*"
[[edge_functions]]
  function = "api"
  path = "/avatars/heruo.jpg"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-store"
